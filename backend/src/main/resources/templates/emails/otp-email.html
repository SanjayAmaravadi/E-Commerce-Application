<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

</head>

<body
        style="
        margin:0;
        padding:0;
        background:#f3f4f6;
        font-family:Arial,sans-serif;
    "
>

<table
        width="100%"
        cellpadding="0"
        cellspacing="0"
        style="
        padding:40px 0;
    "
>

    <tr>

        <td align="center">

            <table
                    width="600"
                    cellpadding="0"
                    cellspacing="0"
                    style="
        background:#ffffff;
        border-radius:18px;
        overflow:hidden;
        box-shadow:0 4px 18px rgba(0,0,0,0.08);
    "
            >

                <!-- HEADER -->

                <tr>

                    <td
                            style="
        background:#111827;
        padding:35px;
        text-align:center;
        color:white;
    "
                    >

                        <h1
                                style="
        margin:0;
        font-size:30px;
    "
                        >
                            SJ Store
                        </h1>

                        <p
                                style="
        margin-top:10px;
        color:#d1d5db;
    "
                        >
                            Secure Account Verification
                        </p>

                    </td>

                </tr>

                <!-- BODY -->

                <tr>

                    <td
                            style="
        padding:45px;
        text-align:center;
    "
                    >

                        <h2
                                style="
        margin-bottom:20px;
        color:#111827;
    "
                        >
                            Verify Your Account
                        </h2>

                        <p
                                style="
        color:#6b7280;
        font-size:16px;
        line-height:1.7;
    "
                        >
                            Use the verification code below
                            to complete your account verification.
                        </p>

                        <div
                                style="
        display:inline-block;
        background:#111827;
        color:white;
        padding:18px 35px;
        border-radius:14px;
        font-size:34px;
        font-weight:bold;
        letter-spacing:10px;
        margin:30px 0;
    "
                                th:text="${otp}"
                        >
                        </div>

                        <p
                                style="
        color:#ef4444;
        font-size:14px;
    "
                        >
                            OTP valid for 5 minutes
                        </p>

                        <p
                                style="
        margin-top:30px;
        color:#6b7280;
        font-size:14px;
        line-height:1.7;
    "
                        >
                            If you did not request this email,
                            you can safely ignore it.
                        </p>

                    </td>

                </tr>

                <!-- FOOTER -->

                <tr>

                    <td
                            style="
        background:#f9fafb;
        padding:25px;
        text-align:center;
        font-size:13px;
        color:#9ca3af;
    "
                    >

                        <p style="margin:0;">
                            © 2026 SJ Store
                        </p>

                        <p style="margin-top:8px;">
                            This is an automated email.
                            Please do not reply.
                        </p>

                    </td>

                </tr>

            </table>

        </td>

    </tr>

</table>

</body>

</html>
