<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

</head>

<body
        style="
        background:#f4f7fb;
        font-family:Arial;
        padding:40px;
    "
>

<div
        style="
        max-width:550px;
        margin:auto;
        background:white;
        border-radius:20px;
        padding:40px;
        text-align:center;
    "
>

    <h1>Reset Password</h1>

    <p>
        Use the OTP below to reset your password.
    </p>

    <div
            style="
            background:#111827;
            color:white;
            display:inline-block;
            padding:18px 35px;
            border-radius:14px;
            font-size:32px;
            letter-spacing:8px;
            margin:20px 0;
        "
            th:text="${otp}"
    ></div>

</div>

</body>

</html>
